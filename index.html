<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Pyrolysis Reactor Digital Simulator</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>
<h1>Waste Pyrolysis Digital Reactor Simulator</h1>
<p>Mixed Waste → Fuel Yield Prediction Tool</p>
</header>

<div class="main">

<div class="input-panel">

<h2>Process Inputs</h2>

<label>Feedstock (kg)</label>
<input type="number" id="feedstock">

<label>Catalyst Loading (%)</label>
<input type="number" id="catalyst">

<label>Temperature (°C)</label>
<input type="number" id="temperature">

<label>Reaction Time (min)</label>
<input type="number" id="time">

<button onclick="calculateYield()">Run Simulation</button>

</div>

<div class="output-panel">

<h2>Results</h2>

<p>Oil Yield: <span id="oil">-</span></p>
<p>Gas Yield: <span id="gas">-</span></p>
<p>Biochar: <span id="char">-</span></p>

<p>Conversion: <span id="conversion">-</span></p>
<p>Carbon Footprint: <span id="carbon">-</span></p>
<p>Estimated Profit: <span id="profit">-</span></p>

</div>

</div>

<section>

<h2>Yield vs Reaction Time</h2>
<canvas id="timeChart"></canvas>

</section>

<section>

<h2>Temperature Optimization</h2>
<canvas id="optChart"></canvas>

</section>

<script src="script.js"></script>
<script src="optimization.js"></script>

</body>
</html>
