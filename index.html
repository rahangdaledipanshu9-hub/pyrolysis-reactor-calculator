<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Pyrolysis Reactor Simulator</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<h1>Pyrolysis Reactor Simulator</h1>

<label>Feedstock (kg)</label>
<input type="number" id="feedstock">

<label>Catalyst Loading (%)</label>
<input type="number" id="catalyst">

<label>Temperature (°C)</label>
<input type="number" id="temperature">

<label>Reaction Time (min)</label>
<input type="number" id="time">

<button onclick="calculateYield()">Run Simulation</button>

<div class="results">

<p>Oil Yield: <span id="oil"></span></p>
<p>Gas Yield: <span id="gas"></span></p>
<p>Biochar Yield: <span id="char"></span></p>
<p>Conversion: <span id="conversion"></span></p>
<p>Carbon Footprint: <span id="carbon"></span></p>
<p>Estimated Profit: <span id="profit"></span></p>

</div>

<h3>Yield vs Time Simulation</h3>

<canvas id="timeChart"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
