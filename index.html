<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Pyrolysis Yield Calculator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Pyrolysis Reactor Calculator</h1>

<label>Feedstock (kg)</label>
<input type="number" id="feedstock" placeholder="Enter feedstock">

<label>Catalyst Loading (%)</label>
<input type="number" id="catalyst" placeholder="Enter catalyst percent">

<label>Temperature (°C)</label>
<input type="number" id="temperature" placeholder="Enter temperature">

<button onclick="calculateYield()">Calculate Yield</button>

<div class="result">

<p>Oil Yield: <span id="oil"></span></p>
<p>Gas Yield: <span id="gas"></span></p>
<p>Biochar: <span id="char"></span></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
